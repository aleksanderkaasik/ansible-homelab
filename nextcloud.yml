---
- name: Running NextCloud Playbook
  hosts:
  vars_files:
    - variables/system/url.yml
    - variables/system/certificate.yml
    - variables/config/nextcloud.yml
  tasks:
    - name: Install PHP modules dependency and Apache2
      become: true
      ansible.builtin.apt:
        name:
          - php
          - libapache2-mod-php
          - php-gd
          - php-mysql
          - php-curl
          - php-mbstring
          - php-intl
          - php-gmp
          - php-xml
          - php-imagick
          - php-zip
          - php-apcu
          - zip
          - python3-pymysql
          - libmagickcore-6.q16-6-extra

    - name: Enable apache
      become: true
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Download NextCloud install script
      become: true
      ansible.builtin.get_url:
        url: https://download.nextcloud.com/server/releases/latest.zip
        dest: /tmp/
        mode: "0655"

    - name: Extract NextCloud files
      become: true
      ansible.builtin.unarchive:
        remote_src: true
        src: /tmp/latest.zip
        dest: "/var/www"
        owner: www-data
        group: www-data

    - name: Running Apache2 role
      ansible.builtin.include_role:
        name: apache2
      vars:
        IsHttpsEnabled: true
        RedirectHttpsIsEnabled: true
        path: "/var/www/nextcloud"
        AddinatalConfig: |
          php_value max_execution_time 1024M
          php_value memory_limit 1024M
          php_value opcache.enable 1
          php_value upload_tmp_dir 1024M
          Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"

    - name: Create NextCloud database
      become: true
      community.mysql.mysql_db:
        name: "{{ database.name }}"
        state: present
        login_user: "{{ RemoteAdminDatabase.Username }}"
        login_password: "{{ RemoteAdminDatabase.Password }}"
        login_host: "{{ database.host }}"
        login_port: "{{ database.port }}"
        encoding: utf8mb4
        collation: utf8mb4_bin

    - name: Create MySQL users
      become: true
      community.mysql.mysql_user:
        login_user: "{{ RemoteAdminDatabase.Username }}"
        login_password: "{{ RemoteAdminDatabase.Password }}"
        login_host: "{{ database.host }}"
        login_port: "{{ database.port }}"
        column_case_sensitive: true
        name: "{{ database.user }}"
        password: "{{ database.password }}"
        host: "%"
        priv:
          "{{ database.name }}.*:ALL"
        state: present
